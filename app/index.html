<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>REAlumen</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; style-src 'self' 'unsafe-inline'; img-src 'self' app: data: blob:; media-src 'self' app: blob:; worker-src 'self' app:">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar"></header>
<main id="workspace">
  <section id="grid-area">
    <div id="grid"></div>
    <div id="decks"></div>
  </section>
  <section id="bottom">
    <div id="monitors" class="panel">
      <div class="monitor">
        <div class="monhead">Composition Monitor</div>
        <div class="monbody"><canvas id="comp"></canvas></div>
        <div class="monfoot" id="stats"></div>
      </div>
      <div class="monitor">
        <div class="monhead">Preview Monitor</div>
        <div class="monbody"><canvas id="preview"></canvas></div>
        <div class="monfoot" id="preview-bar"></div>
      </div>
    </div>
    <div id="props" class="panel"></div>
    <div id="clipprops" class="panel"></div>
    <div id="browser" class="panel"></div>
  </section>
</main>
<div id="advanced" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
